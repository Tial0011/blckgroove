<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLCKGROOVE Entertainment</title>
  <meta name="description" content="BLCKGROOVE Entertainment — premium nightlife experiences." />

  <link rel="icon" href="assets/logo/blckgroove-logo.jpeg" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <link rel="stylesheet" href="css/footer.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body id="top">

  <!-- Navbar is injected here by js/navbar.js from components/navbar.html -->
  <div id="navbar-root"></div>

  <main>
    <!--
      Phase 1 placeholder only — proves the navbar's transparent-to-solid
      scroll transition against a full-height section. Real hero content
      (About, Temptation, Experience, Gallery, Tickets sections) comes
      in later phases.
    -->
    <section class="hero-placeholder">
      <p class="hero-placeholder__note">
        Hero section arrives in the next phase — scroll to see the navbar
        transition from transparent to solid.
      </p>
    </section>

    <section id="about" style="height: 100vh;"></section>
    <section id="temptation" style="height: 100vh;"></section>
    <section id="experience" style="height: 100vh;"></section>
    <section id="gallery" style="height: 100vh;"></section>
  </main>

  <!-- Footer is injected here by js/footer.js from components/footer.html -->
  <div id="footer-root"></div>

  <script src="js/navbar.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
